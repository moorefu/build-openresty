name: Build OpenResty

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string
      openssl_version:
        required: false
        type: string
        default: '3.5.6'
      pcre_version:
        required: false
        type: string
        default: '10.47'
      zlib_version:
        required: false
        type: string
        default: '1.3.2'
      make_latest:
        required: false
        type: boolean
        default: false
      prerelease:
        required: false
        type: boolean
        default: false
    outputs:
      release_version:
        value: ${{ jobs.prepare.outputs.release_version }}

  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to build (e.g. 1.29.2.4)'
        required: true
        type: string
      openssl_version:
        description: 'OpenSSL version'
        required: false
        type: string
        default: '3.5.6'
      pcre_version:
        description: 'PCRE version'
        required: false
        type: string
        default: '10.47'
      zlib_version:
        description: 'zlib version'
        required: false
        type: string
        default: '1.3.2'
      make_latest:
        description: 'Mark as latest release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.setup.outputs.version }}
      openssl_version: ${{ steps.setup.outputs.openssl_version }}
      pcre_version: ${{ steps.setup.outputs.pcre_version }}
      zlib_version: ${{ steps.setup.outputs.zlib_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        id: setup
        run: |
          echo "version=${{ inputs.release_version }}" >> $GITHUB_OUTPUT
          echo "openssl_version=${{ inputs.openssl_version }}" >> $GITHUB_OUTPUT
          echo "pcre_version=${{ inputs.pcre_version }}" >> $GITHUB_OUTPUT
          echo "zlib_version=${{ inputs.zlib_version }}" >> $GITHUB_OUTPUT

  build-linux:
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux2014_x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux2014_aarch64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Build in manylinux container
        env:
          BIND_VERSION: ${{ needs.prepare.outputs.release_version }}
          OS_VER: ${{ needs.prepare.outputs.openssl_version }}
          PCRE_VER: ${{ needs.prepare.outputs.pcre_version }}
          ZLIB_VER: ${{ needs.prepare.outputs.zlib_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm \
            -e BIND_VERSION -e OS_VER -e PCRE_VER -e ZLIB_VER -e ARCH \
            -v "$(pwd)":/workspace \
            -w /workspace \
            ${{ matrix.image }} \
            bash build-openresty.sh "$BIND_VERSION" "$OS_VER" "$PCRE_VER" "$ZLIB_VER" "$ARCH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openresty-linux-${{ matrix.arch }}
          path: |
            openresty-*-linux-glibc2.17-${{ matrix.arch }}-openssl-*.tar.xz
            openresty-*-linux-glibc2.17-${{ matrix.arch }}-openssl-*.tar.xz.sha256

  build-windows:
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: x86_64
            msystem: MINGW64
            toolchain: mingw-w64-x86_64-toolchain
          - arch: x86
            msystem: MINGW32
            toolchain: mingw-w64-i686-toolchain
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Strawberry Perl
        run: choco install strawberryperl -y --no-progress

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.toolchain }}
            make
            patch
            unzip
            tar
            perl
            wget
            zip
            dos2unix

      - name: Build with MSYS2
        shell: msys2 {0}
        env:
          BIND_VERSION: ${{ needs.prepare.outputs.release_version }}
          ARCH: ${{ matrix.arch }}
        run: bash build-openresty-win.sh "$BIND_VERSION" "$ARCH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openresty-windows-${{ matrix.arch }}
          path: |
            openresty-*-windows-${{ matrix.arch }}-msys2.zip
            openresty-*-windows-${{ matrix.arch }}-msys2.zip.sha256

  release:
    needs: [prepare, build-linux, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Set version
        run: |
          echo "VERSION=${{ needs.prepare.outputs.release_version }}" >> $GITHUB_ENV
          echo "OS_VER=${{ needs.prepare.outputs.openssl_version }}" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: OpenResty ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          make_latest: "${{ inputs.make_latest }}"
          prerelease: ${{ inputs.prerelease }}
          files: |
            openresty-linux-x86_64/openresty-${{ env.VERSION }}-linux-glibc2.17-x86_64-openssl-${{ env.OS_VER }}.tar.xz
            openresty-linux-x86_64/openresty-${{ env.VERSION }}-linux-glibc2.17-x86_64-openssl-${{ env.OS_VER }}.tar.xz.sha256
            openresty-linux-aarch64/openresty-${{ env.VERSION }}-linux-glibc2.17-aarch64-openssl-${{ env.OS_VER }}.tar.xz
            openresty-linux-aarch64/openresty-${{ env.VERSION }}-linux-glibc2.17-aarch64-openssl-${{ env.OS_VER }}.tar.xz.sha256
            openresty-windows-x86_64/openresty-${{ env.VERSION }}-windows-x86_64-msys2.zip
            openresty-windows-x86_64/openresty-${{ env.VERSION }}-windows-x86_64-msys2.zip.sha256
            openresty-windows-x86/openresty-${{ env.VERSION }}-windows-x86-msys2.zip
            openresty-windows-x86/openresty-${{ env.VERSION }}-windows-x86-msys2.zip.sha256
