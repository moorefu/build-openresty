name: Build OpenResty

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string
      openssl_version:
        required: false
        type: string
        default: '3.5.9'
      pcre_version:
        required: false
        type: string
        default: '10.49'
      zlib_version:
        required: false
        type: string
        default: '1.3.2'
      make_latest:
        required: false
        type: boolean
        default: false
      prerelease:
        required: false
        type: boolean
        default: false
    outputs:
      release_version:
        value: ${{ jobs.prepare.outputs.release_version }}

  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to build (e.g. 1.31.1.1)'
        required: true
        type: string
      openssl_version:
        description: 'OpenSSL version'
        required: false
        type: string
        default: '3.5.9'
      pcre_version:
        description: 'PCRE version'
        required: false
        type: string
        default: '10.49'
      zlib_version:
        description: 'zlib version'
        required: false
        type: string
        default: '1.3.2'
      make_latest:
        description: 'Mark as latest release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.setup.outputs.version }}
      openssl_version: ${{ steps.setup.outputs.openssl_version }}
      pcre_version: ${{ steps.setup.outputs.pcre_version }}
      zlib_version: ${{ steps.setup.outputs.zlib_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        id: setup
        run: |
          echo "version=${{ inputs.release_version }}" >> $GITHUB_OUTPUT
          echo "openssl_version=${{ inputs.openssl_version }}" >> $GITHUB_OUTPUT
          echo "pcre_version=${{ inputs.pcre_version }}" >> $GITHUB_OUTPUT
          echo "zlib_version=${{ inputs.zlib_version }}" >> $GITHUB_OUTPUT

  build-linux:
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux2014_x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux2014_aarch64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Build in manylinux container
        env:
          BIND_VERSION: ${{ needs.prepare.outputs.release_version }}
          OS_VER: ${{ needs.prepare.outputs.openssl_version }}
          PCRE_VER: ${{ needs.prepare.outputs.pcre_version }}
          ZLIB_VER: ${{ needs.prepare.outputs.zlib_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm \
            -e BIND_VERSION -e OS_VER -e PCRE_VER -e ZLIB_VER -e ARCH \
            -v "$(pwd)":/workspace \
            -w /workspace \
            ${{ matrix.image }} \
            bash -c 'bash ci-fix-yum-repos.sh && bash build-openresty.sh "$BIND_VERSION" "$OS_VER" "$PCRE_VER" "$ZLIB_VER" "$ARCH"'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openresty-linux-${{ matrix.arch }}
          path: |
            openresty-*-linux-glibc2.17-${{ matrix.arch }}-openssl-*.tar.xz
            openresty-*-linux-glibc2.17-${{ matrix.arch }}-openssl-*.tar.xz.sha256
            benchmark-*.txt

  # 目标发行版冒烟: 构建机是 CentOS 系 manylinux(root, 有 nobody 组), 天然
  # 覆盖不到 Debian/Ubuntu 的差异 (无 nobody 组) 和"干净机器上没有
  # /usr/local/openresty/lualib"的 cpath 缺陷。这里对发布产物做真机矩阵,
  # 失败即阻断 release。
  smoke-distros:
    needs: [prepare, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image:
          - centos:7
          - rockylinux:9-minimal
          - debian:11-slim
          - debian:12-slim
          - ubuntu:20.04
          - ubuntu:24.04

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: openresty-linux-x86_64

      - name: Extract package
        run: tar -xJf openresty-*-linux-glibc2.17-x86_64-openssl-*.tar.xz

      - name: Smoke test in ${{ matrix.image }} (root)
        env:
          IMAGE: ${{ matrix.image }}
          OR_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          # Docker Hub 匿名拉取偶发限流/超时, 先带重试拉取镜像
          for i in 1 2 3; do
            docker pull "$IMAGE" && break
            echo "拉取 $IMAGE 失败 (第 $i 次), 重试..."
            sleep 10
          done
          docker run --rm \
            -e OR_VERSION \
            -v "$PWD":/w -w /w \
            "$IMAGE" \
            bash -c 'cp -a "/w/openresty-$OR_VERSION" /opt/or && bash /w/ci-smoke-distro.sh /opt/or'

  build-windows:
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: x86_64
            msystem: MINGW64
            toolchain: mingw-w64-x86_64-toolchain
          - arch: x86
            msystem: MINGW32
            toolchain: mingw-w64-i686-toolchain
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Strawberry Perl
        run: choco install strawberryperl -y --no-progress

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.toolchain }}
            make
            patch
            unzip
            tar
            perl
            wget
            zip
            curl
            dos2unix

      # 禁用 Windows 错误报告弹窗: CI 无交互, 进程崩溃时的 GUI 报错对话框
      # 会令父进程永久等待, 表现为编译中途无输出挂死; 禁用后崩溃即时失败
      - name: Disable Windows error dialogs
        run: |
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Windows" /v ErrorMode /t REG_DWORD /d 2 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting" /v Disabled /t REG_DWORD /d 1 /f

      - name: Build with MSYS2
        timeout-minutes: 45
        shell: msys2 {0}
        env:
          BIND_VERSION: ${{ needs.prepare.outputs.release_version }}
          ARCH: ${{ matrix.arch }}
        run: bash build-openresty-win.sh "$BIND_VERSION" "$ARCH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openresty-windows-${{ matrix.arch }}
          path: |
            openresty-*-windows-${{ matrix.arch }}-msys2.zip
            openresty-*-windows-${{ matrix.arch }}-msys2.zip.sha256

  build-macos:
    needs: prepare
    strategy:
      matrix:
        include:
          # macos-13 (Intel) 已于 2025-12 退役; macos-15-intel 是最后的
          # Intel 镜像 (计划保留至 2027 年), 标准的 macos-15 即 arm64
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MACOS_MIN: '11.0'

    steps:
      - uses: actions/checkout@v4

      - name: Build OpenResty (macOS)
        env:
          BIND_VERSION: ${{ needs.prepare.outputs.release_version }}
          OS_VER: ${{ needs.prepare.outputs.openssl_version }}
          PCRE_VER: ${{ needs.prepare.outputs.pcre_version }}
          ZLIB_VER: ${{ needs.prepare.outputs.zlib_version }}
        run: bash build-openresty-mac.sh "$BIND_VERSION" "$OS_VER" "$PCRE_VER" "$ZLIB_VER"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openresty-macos-${{ matrix.arch }}
          path: |
            openresty-*-macos-*-${{ matrix.arch }}-openssl-*.tar.xz
            openresty-*-macos-*-${{ matrix.arch }}-openssl-*.tar.xz.sha256
            benchmark-*.txt

  release:
    needs: [prepare, build-linux, build-windows, build-macos, smoke-distros]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read          # actions/download-artifact
      # actions/attest-build-provenance 需要 OIDC 与 attestation 写权限
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set version
        run: |
          echo "VERSION=${{ needs.prepare.outputs.release_version }}" >> $GITHUB_ENV
          echo "OS_VER=${{ needs.prepare.outputs.openssl_version }}" >> $GITHUB_ENV
          echo "PCRE_VER=${{ needs.prepare.outputs.pcre_version }}" >> $GITHUB_ENV
          echo "ZLIB_VER=${{ needs.prepare.outputs.zlib_version }}" >> $GITHUB_ENV
          echo "MACOS_MIN=11.0" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4

      - name: Generate SHA256SUMS
        run: |
          # 汇总校验和: 用 basename, 与 Release 资产名一致, 便于
          # sha256sum -c 和 gh attestation verify 直接使用
          : > SHA256SUMS
          for f in openresty-*/*.tar.xz openresty-*/*.zip; do
            ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" ) >> SHA256SUMS
          done
          sort -k2 SHA256SUMS -o SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: SHA256SUMS

      - name: Compose release body with benchmark results
        run: |
          {
            echo "## 基准测试结果"
            echo
            echo "共享 CI runner 上的参考数字, 波动较大, 仅供版本间粗对比。"
            for f in */benchmark-*.txt; do
              [ -f "$f" ] || continue
              cat "$f"
              echo
            done
            echo "## 构建信息"
            echo
            echo "- 构建提交: $(git rev-parse --short HEAD) $(git log -1 --pretty=%s)"
            echo "- 构建时间: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- 依赖: OpenSSL ${OS_VER} / PCRE2 ${PCRE_VER} / zlib ${ZLIB_VER} (随包分发)"
            echo "- Linux 基线: glibc 2.17; macOS 基线: ${MACOS_MIN}"
            echo "- Linux 加固: stack protector / FORTIFY / 完整 RELRO (BIND_NOW, 含 LuaJIT 与 lualib C 模块)"
            echo "- 默认 conf 监听 8080; 不支持 Alpine/musl; resty/opm 需要 Perl"
            echo "- 同名 tag 的资产可能被后续构建覆盖, 以上面的提交与时间为准"
            echo
            echo "## 校验与来源"
            echo
            echo "- 校验和: 下载全部产物后执行 sha256sum -c SHA256SUMS"
            echo "- 构建来源: gh attestation verify <文件> --repo ${GITHUB_REPOSITORY}"
          } > release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: OpenResty ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          make_latest: "${{ inputs.make_latest }}"
          prerelease: ${{ inputs.prerelease }}
          body_path: release_body.md
          files: |
            SHA256SUMS
            openresty-linux-x86_64/openresty-${{ env.VERSION }}-linux-glibc2.17-x86_64-openssl-${{ env.OS_VER }}.tar.xz
            openresty-linux-x86_64/openresty-${{ env.VERSION }}-linux-glibc2.17-x86_64-openssl-${{ env.OS_VER }}.tar.xz.sha256
            openresty-linux-aarch64/openresty-${{ env.VERSION }}-linux-glibc2.17-aarch64-openssl-${{ env.OS_VER }}.tar.xz
            openresty-linux-aarch64/openresty-${{ env.VERSION }}-linux-glibc2.17-aarch64-openssl-${{ env.OS_VER }}.tar.xz.sha256
            openresty-windows-x86_64/openresty-${{ env.VERSION }}-windows-x86_64-msys2.zip
            openresty-windows-x86_64/openresty-${{ env.VERSION }}-windows-x86_64-msys2.zip.sha256
            openresty-windows-x86/openresty-${{ env.VERSION }}-windows-x86-msys2.zip
            openresty-windows-x86/openresty-${{ env.VERSION }}-windows-x86-msys2.zip.sha256
            openresty-macos-arm64/openresty-${{ env.VERSION }}-macos-${{ env.MACOS_MIN }}-arm64-openssl-${{ env.OS_VER }}.tar.xz
            openresty-macos-arm64/openresty-${{ env.VERSION }}-macos-${{ env.MACOS_MIN }}-arm64-openssl-${{ env.OS_VER }}.tar.xz.sha256
            openresty-macos-x86_64/openresty-${{ env.VERSION }}-macos-${{ env.MACOS_MIN }}-x86_64-openssl-${{ env.OS_VER }}.tar.xz
            openresty-macos-x86_64/openresty-${{ env.VERSION }}-macos-${{ env.MACOS_MIN }}-x86_64-openssl-${{ env.OS_VER }}.tar.xz.sha256
